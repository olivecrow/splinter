name: Foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore, build and test
        shell: pwsh
        run: ./scripts/build.ps1
